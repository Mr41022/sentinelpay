name: Deploy to Railway (scaffold)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -sL https://railway.app/install.sh | sh

      - name: Railway deploy (example)
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          # This step assumes you've created a Railway project and set RAILWAY_API_KEY in repo secrets.
          # Adjust the commands below as needed for your Railway setup.
          railway login --apiKey "$RAILWAY_API_KEY"
          railway up --detach

      - name: Notify
        run: echo "Railway deploy attempted. Check Railway project dashboard for details."
